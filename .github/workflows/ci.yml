name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Tests
        run: python -m pytest
      - name: Live weather and FX API smoke
        run: python -m scripts.live_api_smoke
      - name: Live Gemini API smoke
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GEMINI_MODEL: gemini-3.8-flash
        run: python -m scripts.gemini_api_smoke
      - name: Report missing Gemini smoke credential
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "::warning::GEMINI_API_KEY secret is not configured; live Gemini smoke was skipped."
      - name: Compile
        run: python -m compileall -q app.py routematrix
